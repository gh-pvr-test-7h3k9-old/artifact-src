name: sign
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - run: echo "legit artifact v1" > artifact.bin
      - uses: actions/att
        with:
          subject-path: a
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.
