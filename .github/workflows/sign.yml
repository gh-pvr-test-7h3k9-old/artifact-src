name: sign
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - run: echo "legit "legit artifact v1" > artifact.bin
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifact.bin
      - uses: actions/upl
        with:
          name: artifact
          path: artifact.bin
